# Config Mosquitto — PRODUCTION (VPS), avec TLS pour les clients distants.
# Utilisée uniquement via docker-compose.prod.yml (docker compose -f
# docker-compose.yml -f docker-compose.prod.yml up -d) — mosquitto.conf
# (sans TLS) reste la config par défaut pour le développement local, où des
# certificats ne sont pas toujours disponibles.
#
# Prérequis avant d'utiliser cette config : des certificats valides dans
# ./certs/ (gitignored) — typiquement obtenus via certbot (Let's Encrypt) :
#   certbot certonly --standalone -d mqtt.votredomaine.exemple
#   cp /etc/letsencrypt/live/mqtt.votredomaine.exemple/fullchain.pem ./certs/
#   cp /etc/letsencrypt/live/mqtt.votredomaine.exemple/privkey.pem  ./certs/
# Renouvellement : certbot renew (cron), puis `docker compose restart mosquitto`.

# Listener interne (1883, PAS publié vers l'hôte par docker-compose.prod.yml)
# — uniquement pour les conteneurs du même réseau docker-compose (bridge),
# qui ne quitte jamais la machine : le clair y est sans risque.
listener 1883
allow_anonymous false
password_file /mosquitto/config/password.txt

# Listener externe (8883, publié vers l'hôte) — pour les clients distants
# (PC labo Windows à Amiens, Raspberry Pi à Amiens), qui traversent
# internet : TLS obligatoire.
listener 8883
allow_anonymous false
password_file /mosquitto/config/password.txt
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
