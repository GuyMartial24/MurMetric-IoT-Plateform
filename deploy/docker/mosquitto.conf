listener 1883
allow_anonymous false
password_file /mosquitto/config/password.txt

# Écoute TLS (production) — activée uniquement via docker-compose.prod.yml
# (docker-compose.yml de base ne monte pas de certificats, ce listener n'est
# donc pas déclaré ici pour ne pas empêcher le démarrage en local/dev sans
# certificat). Voir mosquitto.prod.conf + docker-compose.prod.yml.