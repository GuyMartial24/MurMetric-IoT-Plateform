apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: murmetric
spec:
  selector:
    app: timescaledb
  ports:
    - port: 5432
      targetPort: 5432
  # ClusterIP (défaut) : joignable uniquement depuis l'intérieur du cluster,
  # même principe que le service influxdb existant — aucune exposition
  # externe tant que ce n'est pas nécessaire.
