apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  namespace: murmetric
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:latest-pg16
          # Déploiement isolé (Phase 0, section 32) — aucune interaction avec
          # le pipeline d'ingestion ni la webapp tant que les phases
          # suivantes ne sont pas explicitement validées. Ressources
          # volontairement modestes au départ (le nœud est partagé, cf.
          # commentaire équivalent sur influxdb/statefulset.yaml) — à
          # retuner une fois l'historique réel chargé en Phase 1.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: murmetric
            - name: POSTGRES_DB
              value: murmetric_timeseries
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: timescaledb-password
          volumeMounts:
            - name: timescaledb-data
              mountPath: /var/lib/postgresql/data
            - name: timescaledb-schema
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: timescaledb-data
          persistentVolumeClaim:
            claimName: timescaledb-pvc
        - name: timescaledb-schema
          configMap:
            name: timescaledb-schema
