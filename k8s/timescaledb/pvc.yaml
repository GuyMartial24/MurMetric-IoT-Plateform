apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timescaledb-pvc
  namespace: murmetric
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Marge confortable pour l'historique complet une fois migré (InfluxDB
      # pèse ~15-20 Go compressé aujourd'hui) — la compression native
      # TimescaleDB (Phase 5/6) devrait ramener ça à un ordre de grandeur
      # comparable une fois les anciens chunks compressés.
      storage: 30Gi
