# Autoscaling horizontal de kafka-consumer-influx selon la charge CPU.
#
# C'est le SEUL composant MurMetric conçu pour scaler automatiquement : toutes
# les instances partagent le même group_id Kafka (murmetric-influx), donc
# Kafka répartit les partitions entre elles sans doublon ni perte.
#
# maxReplicas=6 est aligné sur KAFKA_CFG_NUM_PARTITIONS=6 (cf. kafka/statefulset.yaml) :
# au-delà de 6 replicas actifs sur un même topic, les instances supplémentaires
# resteraient inactives (pas plus de consommateurs actifs que de partitions).
#
# Prérequis cluster : metrics-server doit être installé et fonctionnel
# (k3s l'inclut par défaut). Vérifier avec : kubectl top pods -n murmetric
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kafka-consumer-influx
  namespace: murmetric
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kafka-consumer-influx
  minReplicas: 1
  # Ramené de 6 à 2 le 07/08/2026. maxReplicas=6 avait été aligné sur les
  # 6 partitions Kafka, en supposant que le consumer était un goulot
  # d'étranglement — la mesure a montré que non (le plafond était côté Amiens,
  # dans le coût par message MQTT). Avec la publication par lots, un message
  # Kafka porte 600 échantillons : le nombre de messages à consommer chute d'un
  # facteur ~600 et un seul consumer suffit très largement. On garde 2 comme
  # marge de rafale, sans laisser MurMetric revendiquer tout un nœud 4 cœurs
  # partagé avec MailFlow, MINER et ollama.
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Attendre 5 min de charge faible avant de retirer un replica, pour
      # éviter un yoyo si le débit Kafka est irrégulier (rafales de capteurs).
      stabilizationWindowSeconds: 300
