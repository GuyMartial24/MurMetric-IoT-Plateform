apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer-influx
  namespace: murmetric
spec:
  # Scaling automatique géré par hpa.yaml (HorizontalPodAutoscaler) selon le
  # CPU consommé — replicas ci-dessous est juste la valeur de démarrage.
  # Toutes les instances partagent le même group_id Kafka → répartition auto.
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer-influx
  template:
    metadata:
      labels:
        app: kafka-consumer-influx
    spec:
      containers:
        - name: consumer
          image: murmetric-kafka-consumer:latest
          # IfNotPresent : image buildée localement (pas de registre), sinon
          # Kubernetes tente un pull distant par défaut sur un tag ":latest".
          imagePullPolicy: IfNotPresent
          # Rebuild requis après modification de kafka_consumer_influx.py :
          #   docker build -t murmetric-kafka-consumer:latest -f Dockerfile.kafka-consumer .
          env:
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: kafka-bootstrap
            - name: KAFKA_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: kafka-group-id
            - name: TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: tenant-id
            - name: INFLUX_URL
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: influx-url
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: influx-token
            - name: INFLUX_ORG
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: influx-org
            - name: INFLUX_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: influx-bucket
          # Requis pour que le HPA (hpa.yaml) puisse calculer un % d'usage CPU.
          # Le consumer déplie chaque message de lot en N points InfluxDB :
          # c'est lui qui fabrique le line protocol, donc le poste CPU le plus
          # sensible côté MurMetric. Request relevée (100m → 150m) pour qu'il
          # ait un poids correct face aux autres cgroups du nœud, limite
          # abaissée (500m → 400m) pour borner l'appétit total de MurMetric sur
          # un nœud partagé avec MailFlow/MINER/ollama.
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
