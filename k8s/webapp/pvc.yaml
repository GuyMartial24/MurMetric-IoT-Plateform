apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: murmetric-webapp-data
  namespace: murmetric
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # users.json + parametres.json + capteurs.json/capteurs_retrait.json
      # (source unique, section 32) — quelques dizaines de Ko réels au total,
      # 100Mi est déjà large.
      storage: 100Mi
