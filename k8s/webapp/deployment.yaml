apiVersion: apps/v1
kind: Deployment
metadata:
  name: murmetric-webapp
  namespace: murmetric
spec:
  replicas: 1
  selector:
    matchLabels:
      app: murmetric-webapp
  template:
    metadata:
      labels:
        app: murmetric-webapp
    spec:
      containers:
        - name: webapp
          image: murmetric-webapp:latest
          # IfNotPresent : image buildée localement sur le nœud (pas de
          # registre), même convention que kafka-consumer-influx.
          # Rebuild requis après modification de murmetric_webapp/** :
          #   docker build -t murmetric-webapp:latest -f Dockerfile.webapp .
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: INFLUX_URL
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: influx-url
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: influx-token
            - name: INFLUX_ORG
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: influx-org
            - name: INFLUX_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: influx-bucket
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: groq-api-key
            - name: GROQ_MODEL
              value: llama-3.3-70b-versatile
            # Gemini (Google AI Studio) — fournisseur primaire de l'assistant
            # depuis le 13/08/2026 (texte + vision), Groq passant en repli
            # texte uniquement. Clé fournie par l'utilisateur ce jour-là.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: webapp-gemini-api-key
            - name: GEMINI_MODEL
              value: gemini-flash-latest
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: webapp-jwt-secret
            - name: ADMIN_BOOTSTRAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: webapp-admin-username
            - name: ADMIN_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: webapp-admin-password
            # Clé partagée pour les endpoints machine-à-machine
            # (POST /api/capteurs/*/enregistrer), appelés sans session
            # utilisateur par ingestion_dewesoft_dxd.py (PC Amiens) et
            # ingestion_capteurs_bluetooth.py (Pi) — cf. chantier "source
            # unique", section 32 (13/08/2026).
            - name: INGESTION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: webapp-ingestion-api-key
            # Monitoring des pipelines (section 32, 13/08/2026) : broker MQTT
            # **interne** au cluster (mosquitto:1883, même valeurs que
            # bridge-mqtt-kafka), pas le 8883/TLS externe utilisé par le PC
            # Amiens/le Pi — la webapp reste dans le namespace, pas besoin de
            # TLS pour parler à un Service ClusterIP.
            - name: MQTT_BROKER
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: mqtt-broker
            - name: MQTT_PORT
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: mqtt-port
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: mqtt-username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: mqtt-password
            # users.json ET capteurs.json/capteurs_retrait.json doivent
            # survivre aux rebuilds d'image — volume persistant dédié
            # (capteurs.json/capteurs_retrait.json amorcés depuis l'image au
            # tout premier démarrage seulement, cf. app/main.py).
            - name: USERS_DIR
              value: /data
          volumeMounts:
            - name: webapp-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: webapp-data
          persistentVolumeClaim:
            claimName: murmetric-webapp-data
