apiVersion: v1
kind: Service
metadata:
  name: murmetric-webapp
  namespace: murmetric
spec:
  selector:
    app: murmetric-webapp
  ports:
    - port: 8090
      targetPort: 8000
  # LoadBalancer (ServiceLB k3s), même pattern que grafana/service.yaml.
  # Port 8090 choisi libre sur le VPS (vérifié le 12/08/2026) — mais non
  # joignable depuis Internet tant que le port n'est pas ouvert au niveau
  # de la Security List Oracle Cloud (hors de portée SSH/kubectl, seuls les
  # ports 22 et 8883 y sont actuellement autorisés — cf. logique_projet.md
  # section 32). Ce Service est déjà prêt pour le jour où ce port sera ouvert.
  type: LoadBalancer
