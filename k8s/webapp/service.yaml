apiVersion: v1
kind: Service
metadata:
  name: murmetric-webapp
  namespace: murmetric
spec:
  selector:
    app: murmetric-webapp
  ports:
    - port: 8090
      targetPort: 8000
  # ClusterIP depuis le 19/08/2026 (section 37 addendum) : plus d'exposition
  # directe hors cluster (le port 8090 avait fini par être ouvert au niveau
  # de la Security List Oracle Cloud, cf. historique section 32) — seul le
  # reverse proxy Caddy (k8s/caddy/, HTTPS) sert désormais de porte d'entrée
  # externe. Caddy route en interne vers ce Service
  # (murmetric-webapp:8090), donc le changement ne l'affecte pas.
  type: ClusterIP
