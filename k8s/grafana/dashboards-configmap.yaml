# Provisioning des dashboards Grafana - equivalent du configmap.yaml
# existant pour la datasource, mais pour les dashboards eux-memes. Deux
# ConfigMaps distincts car deux emplacements differents dans le conteneur :
# le "provider" (declare ou chercher les dashboards) et les JSON eux-memes.
#
# NOTE (31/08/2026) : ce fichier ne pilote pas le deploiement reel — le
# ConfigMap "grafana-dashboards" est mis a jour directement depuis
# k8s/grafana/dashboards/hr-t-socma.json via
# "kubectl create configmap ... --from-file=... | kubectl apply -f -"
# (Grafana recharge seul, updateIntervalSeconds: 30). Garde ici a jour pour
# la lisibilite/lhistorique du repo, pas comme source de verite active —
# etait desynchronise (ancienne syntaxe Flux, version 6) avant cette mise
# a jour, resynchronise avec le JSON reellement deploye (version 9).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: murmetric
data:
  provider.yml: |
    apiVersion: 1
    providers:
      - name: MurMetric
        type: file
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
