apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: murmetric
spec:
  # Pas de HPA ici : Grafana OSS stocke dashboards/sessions dans un SQLite
  # local (volume grafana-pvc). Plusieurs replicas auraient chacun leur propre
  # état, non partagé — aucun intérêt à scaler sans backend externe
  # (Postgres/MySQL partagé). La visualisation n'est de toute façon jamais le
  # goulot d'étranglement de cette architecture (peu de requêtes, peu d'utilisateurs).
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          # 11.1.0 -> 13.0.2 le 19/08/2026 (section 37 addendum) : requis par
          # Grafana Assistant (>=13.0.0-0). Jamais 13.0.0 pile — version
          # retirée par Grafana Labs suite à un bug de migration ayant fait
          # perdre des dashboards/dossiers chez certains utilisateurs.
          # Validé au préalable sur une instance de test isolée (copie des
          # données réelles, même provisioning) : migrations sans erreur,
          # datasources InfluxDB Flux+InfluxQL fonctionnelles (vraies
          # requêtes testées), dashboard provisionné intact, embedding en
          # iframe (mode kiosk) toujours opérationnel. Sauvegarde du volume
          # de production prise juste avant bascule
          # (grafana_backup_avant_13_20260819.tar.gz sur le VPS).
          image: grafana/grafana-oss:13.0.2
          # Consultation seulement : aucune raison de peser sur un nœud partagé.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: grafana-admin-password
            # Utilisé par ${INFLUX_TOKEN} dans le provisioning de datasource
            # (grafana-datasources ConfigMap) — substitution faite par Grafana
            # au démarrage à partir de ses propres variables d'environnement.
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: influx-token
            # Embedding + accès anonyme lecture seule — nécessaires pour
            # afficher un dashboard en iframe dans murmetric-webapp sans
            # écran de connexion (décision utilisateur du 12/08/2026, cf.
            # logique_projet.md section 32). Le rôle Viewer ne donne accès
            # ni à l'admin ni aux identifiants de datasource, seulement aux
            # panels des dashboards déjà provisionnés.
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            # Grafana Assistant (section 37 addendum, 19/08/2026) : chat IA
            # officiel Grafana — contrairement à grafana-llm-app (abandonné,
            # bug plugin), l'inférence tourne côté Grafana Cloud, aucun
            # mapping de modèle local à configurer. Installation seule ici
            # (comme grafana-llm-app, survit à une recréation du PVC) ; la
            # connexion au compte Grafana Cloud (OAuth) se fait ensuite
            # manuellement dans l'interface (Administration > Plugins >
            # Grafana Assistant > Connection > Start Connection) — étape que
            # seul l'utilisateur peut réaliser avec ses identifiants.
            - name: GF_INSTALL_PLUGINS
              value: grafana-assistant-app
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
