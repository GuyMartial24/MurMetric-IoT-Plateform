apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: murmetric
spec:
  # Pas de HPA ici : Grafana OSS stocke dashboards/sessions dans un SQLite
  # local (volume grafana-pvc). Plusieurs replicas auraient chacun leur propre
  # état, non partagé — aucun intérêt à scaler sans backend externe
  # (Postgres/MySQL partagé). La visualisation n'est de toute façon jamais le
  # goulot d'étranglement de cette architecture (peu de requêtes, peu d'utilisateurs).
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana-oss:11.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: grafana-admin-password
            # Utilisé par ${INFLUX_TOKEN} dans le provisioning de datasource
            # (grafana-datasources ConfigMap) — substitution faite par Grafana
            # au démarrage à partir de ses propres variables d'environnement.
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: influx-token
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: datasources
          configMap:
            name: grafana-datasources
