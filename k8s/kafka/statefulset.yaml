apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: murmetric
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          # bitnami/kafka a été retiré du Docker Hub gratuit (catalogue Bitnami
          # restructuré en 2025) — les anciens tags versionnés sont conservés
          # sous le namespace bitnamilegacy/.
          image: bitnamilegacy/kafka:3.7
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_CFG_NODE_ID
              value: "1"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka:9093"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            # 6 partitions par topic auto-créé — condition nécessaire pour que
            # kafka-consumer-influx (cf. hpa.yaml) puisse réellement scaler :
            # un consumer group ne peut pas avoir plus de consommateurs actifs
            # que de partitions sur un topic donné.
            - name: KAFKA_CFG_NUM_PARTITIONS
              value: "6"
            - name: KAFKA_CFG_LOG_RETENTION_HOURS
              value: "168"
            # Heap JVM borné explicitement : sans ça, Kafka dimensionne son
            # heap par défaut sur la mémoire totale de l'hôte (variable selon
            # la machine), ce qui rend le démarrage imprévisible et peut faire
            # dépasser le timeout interne d'enregistrement broker↔controller
            # (observé : crash-loop "unable to register with controller quorum").
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms512m"
          # Abaissé le 07/08/2026 (était 500m/1 cœur) : avec la publication par
          # lots, Kafka ne voit plus ~54 000 petits messages/s mais ~90 messages
          # de ~17 ko/s — le travail par message s'effondre. Le CPU récupéré est
          # rendu au nœud, partagé avec MailFlow/MINER/ollama.
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: 600m
              memory: 1Gi
          volumeMounts:
            - name: kafka-data
              mountPath: /bitnami/kafka
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
