apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: murmetric
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0
          # Nœud 4 cœurs PARTAGÉ avec d'autres projets de l'utilisateur
          # (MailFlow, MINER, et le service ollama qu'ils pilotent) : chaque
          # charge MurMetric est plafonnée pour ne jamais pouvoir accaparer le
          # nœud. Mosquitto est très économe (mesuré : 0,05 cœur pour
          # 3 100 msg/s, 0,20 cœur pour 62 Mbit/s), 250m laisse une marge large.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          ports:
            - containerPort: 1883
            - containerPort: 8883
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
            - name: secrets
              mountPath: /mosquitto/secrets
              readOnly: true
            - name: certs
              mountPath: /mosquitto/certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: secrets
          secret:
            secretName: murmetric-secrets
            items:
              - key: mosquitto-password-file
                path: password.txt
        - name: certs
          # Secret TLS créé manuellement (pas via secrets.yaml, dérivé de
          # fichiers .pem générés sur le VPS) :
          #   kubectl create secret tls mosquitto-tls --cert=fullchain.pem \
          #     --key=privkey.pem -n murmetric
          secret:
            secretName: mosquitto-tls
