apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: murmetric
spec:
  selector:
    app: influxdb
  ports:
    - port: 8086
      targetPort: 8086
  # ClusterIP : InfluxDB accessible en interne uniquement (kafka-consumer).
  # Exposer en LoadBalancer uniquement si Grafana est hors cluster.
  type: ClusterIP
