apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb
  namespace: murmetric
spec:
  serviceName: influxdb
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:2.7
          # Plafond mémoire PAR REQUÊTE (17/08/2026, section 33) — sans ça, le
          # moteur de requêtes n'a AUCUN garde-fou serveur (confirmé dans les
          # logs : memory_bytes_quota_per_query au maximum int64, illimité de
          # fait). Trois incidents le même jour pendant le test du script de
          # migration Phase 1 : une requête plus coûteuse que prévu consommait
          # toute la mémoire du pod jusqu'à l'OOM-kill, plutôt que d'échouer
          # proprement. 1 GiB par requête, bien sous le plafond total de 4Gi —
          # une requête qui dépasse échoue maintenant avec une erreur claire
          # côté client au lieu de faire tomber tout le pod.
          args:
            - "--query-memory-bytes=1073741824"
            - "--query-initial-memory-bytes=10485760"
          # Poste le plus gourmand de la chaîne pendant un import massif (c'est
          # lui qui indexe et écrit les points), d'où le plafond le plus haut —
          # mais plafond tout de même : le nœud 4 cœurs est partagé avec
          # d'autres projets (MailFlow, MINER, ollama).
          #
          # Mémoire relevée 256Mi/1Gi -> 512Mi/4Gi le 13/08/2026 : la limite de
          # 1Gi, fixée tôt dans le projet, est devenue trop basse par rapport
          # au volume réel de mesures_dewesoft (retrait) une fois le backfill
          # complet fait — 15 Go sur disque, ~1,5 milliard de points. Constaté
          # en direct : le pod se faisait OOM-kill (exit 137) sur des requêtes
          # Grafana pourtant raisonnables (un seul canal, 7 jours), confirmé
          # par `kubectl top` juste avant le kill (~1022Mi, au ras du plafond).
          # Un premier passage à 3Gi suffisait tout juste (dashboard retrait
          # SOCMA à ~3067Mi, à quelques Mio du kill) — remonté à 4Gi pour une
          # marge réelle plutôt qu'une configuration à la limite.
          #
          # 4Gi -> 8Gi le 17/08/2026 (reprise Phase 1, section 33) : deux
          # OOM réels sur mesures_dewesoft (10 Hz continu, 8 canaux) même
          # avec un motif de requête journalier déjà prouvé sûr ailleurs
          # (mesures_capteurs, Phase 0) — la densité de cette mesure semble
          # dépasser la marge de 4Gi une fois le quota mémoire par requête
          # (1GiB) additionné au working set. Nœud à 23Gi RAM, 9,2Gi
          # disponibles, seulement 31% déjà alloué tous pods confondus :
          # marge large pour absorber le doublement.
          #
          # CPU 700m -> 1500m le 18/08/2026 : panels Grafana retrait (90j,
          # 4 canaux/panel, un seul canal par requête InfluxQL — combiner
          # plusieurs canaux dans un filtre OR déjà écarté, section 33)
          # chronométrés à ~9,4s/canal, ~33s pour un panel complet, CPU
          # observé au ras du plafond de 700m pendant le test (667m). Nœud
          # 4 cœurs, seulement 67% déjà alloué en limites tous pods
          # confondus : marge pour laisser InfluxDB utiliser plus de cœurs
          # sur ces agrégations, sans viser le plafond du nœud.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 8Gi
          ports:
            - containerPort: 8086
          env:
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: setup
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              value: admin
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: influx-password
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: FRD_CODEM
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: Test_Capteurs
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: influx-token
          volumeMounts:
            - name: influxdb-data
              mountPath: /var/lib/influxdb2
      volumes:
        - name: influxdb-data
          persistentVolumeClaim:
            claimName: influxdb-pvc
