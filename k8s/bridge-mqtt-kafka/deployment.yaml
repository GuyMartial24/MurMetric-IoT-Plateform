apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge-mqtt-kafka
  namespace: murmetric
spec:
  # ⚠️ Ne PAS scaler ce déploiement en l'état (pas de HPA ici, contrairement à
  # kafka-consumer-influx). Chaque replica s'abonnerait indépendamment aux
  # mêmes topics MQTT et republierait donc CHAQUE message dans Kafka en double
  # (voire N fois) — Mosquitto ne répartit pas la charge entre abonnés comme
  # le fait un consumer group Kafka. Scaling possible uniquement après avoir
  # migré vers des "shared subscriptions" MQTT v5 ($share/...), non fait ici.
  replicas: 1
  selector:
    matchLabels:
      app: bridge-mqtt-kafka
  template:
    metadata:
      labels:
        app: bridge-mqtt-kafka
    spec:
      containers:
        - name: bridge
          image: murmetric-bridge:latest
          # IfNotPresent : image buildée localement (pas de registre), sinon
          # Kubernetes tente un pull distant par défaut sur un tag ":latest".
          imagePullPolicy: IfNotPresent
          # Rebuild requis après modification de bridge_mqtt_to_kafka.py :
          #   docker build -t murmetric-bridge:latest -f Dockerfile.bridge .
          env:
            - name: MQTT_BROKER
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: mqtt-broker
            - name: MQTT_PORT
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: mqtt-port
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: mqtt-username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: murmetric-secrets
                  key: mqtt-password
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: kafka-bootstrap
            - name: TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: murmetric-config
                  key: tenant-id
